[project]
name = "s2y"
version = "0.1.0"
description = "Bidirectional Spotify <-> YouTube Music sync, as a TUI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ian Murray" }]
dependencies = [
    "spotipy>=2.24",
    "ytmusicapi>=1.8,<2",
    "textual>=0.79",
    "platformdirs>=4.2",
]

[project.scripts]
s2y = "s2y.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2y"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/s2y"]
ignore_missing_imports = true
